# Artifact Hub package metadata for the Mirops Headlamp plugin — this is what makes the
# plugin appear (and update) in Headlamp's in-app Plugin Catalog.
#
# NOTE: On `main` this file is a TEMPLATE. Its `version` and `archive-checksum` are
# placeholders and are intentionally NOT updated here — `main` is PR-only, so CI cannot
# push to it. On each release, the workflow (.github/workflows/release.yaml) fills in the
# real version, checksum and archive-url and force-pushes the result to the dedicated
# `artifacthub` branch. Artifact Hub is configured to scan the `artifacthub` branch (not
# `main`), so the catalog always reflects the latest release. Think of `main` as the source
# and `artifacthub` as the published output (like a gh-pages branch).
version: 0.1.0
name: mirops
displayName: Mirops
createdAt: "2026-09-20T00:00:00Z"
# Logo shown in the Artifact Hub / Headlamp catalog card. Commit the image to the repo
# (e.g. docs/logo.png) and reference its raw URL. Must be a public, direct image URL.
logoURL: https://raw.githubusercontent.com/miropshq/mirops-headlamp-plugin/main/docs/logo.png
description: |
  Visualize Kubernetes upgrade readiness inside Headlamp — the logical mirror, the
  SAFE/WARNING/CRITICAL verdict, the score breakdown, add-on compatibility, the
  per-namespace risk heatmap and dependency graph, plus review and approve
  operator-proposed remediation plans.
license: Apache-2.0
homeURL: https://github.com/miropshq/mirops-headlamp-plugin
links:
  - name: source
    url: https://github.com/miropshq/mirops-headlamp-plugin
  - name: docs
    url: https://github.com/miropshq/mirops-docs
keywords:
  - kubernetes
  - kubernetes-upgrade
  - mirops
  - headlamp
  - upgrade-readiness
# Shown in the package gallery. Commit the images to the repo (e.g. docs/) and use raw URLs.
screenshots:
  - title: Upgrade Analysis — verdict and score breakdown
    url: https://raw.githubusercontent.com/miropshq/mirops-headlamp-plugin/main/docs/score-breakdown.png
annotations:
  headlamp/plugin/archive-url: "https://github.com/miropshq/mirops-headlamp-plugin/releases/download/v0.1.0/mirops-0.1.0.tar.gz"
  headlamp/plugin/archive-checksum: "SHA256:REPLACE_ON_RELEASE"
  headlamp/plugin/version-compat: ">=0.25.0"
  headlamp/plugin/distro-compat: "in-cluster,web,docker-desktop,desktop"
