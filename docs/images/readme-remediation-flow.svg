<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Mirops remediation approval flow</title><desc id="desc">When enabled, upgrade analysis can produce a RemediationPlan with suggested actions. An operator reviews and approves the plan, then selects actions for execution. Creating a plan does not automatically perform an upgrade.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1100" height="360" rx="26" fill="url(#bg)"/><text x="48" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">Remediation stays reviewable and approval-based</text>
<g filter="url(#s)"><rect x="45" y="125" width="210" height="135" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="330" y="125" width="210" height="135" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="615" y="125" width="210" height="135" rx="18" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="900" y="125" width="155" height="135" rx="18" fill="#fff" stroke="#fdba74" stroke-width="2"/></g>
<text x="150" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">UpgradeAnalysis</text><text x="150" y="197" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Optional suggestions</text><text x="150" y="226" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Remediation enabled</text>
<text x="435" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#6d28d9">RemediationPlan</text><text x="435" y="197" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Proposed actions</text><text x="435" y="226" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Review before execution</text>
<text x="720" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#047857">Human approval</text><text x="720" y="197" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Approve selected actions</text><text x="720" y="226" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Explicit operator step</text>
<text x="977" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#c2410c">Execute</text><text x="977" y="197" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Chosen actions</text><text x="977" y="226" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">No auto-upgrade</text>
<path d="M255 192H319" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M540 192H604" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M825 192H889" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<text x="48" y="315" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">The plan proposes remediation; creating an analysis or plan does not execute an upgrade.</text></svg>