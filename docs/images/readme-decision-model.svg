<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Headlamp readiness, risk and decision model</title><desc id="desc">Readiness score is a higher-is-better health gauge. Risk severity is a higher-is-worse component and namespace signal. The deterministic decision and blockers determine whether an upgrade is allowed. These are separate axes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f3ff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="410" rx="28" fill="url(#bg)"/><text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#172554">Keep the score, risk, and upgrade decision distinct</text>
<g filter="url(#s)"><rect x="55" y="130" width="300" height="170" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="450" y="130" width="300" height="170" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="845" y="90" width="300" height="100" rx="20" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="845" y="220" width="300" height="100" rx="20" fill="#fff" stroke="#fda4af" stroke-width="2"/></g>
<text x="205" y="169" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Readiness score</text><text x="205" y="202" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">0–100 · higher is better</text><text x="205" y="232" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Health gauge and breakdown</text><text x="205" y="266" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Does not decide allow</text>
<text x="600" y="169" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#6d28d9">Component / namespace risk</text><text x="600" y="202" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">0–100 · higher is worse</text><text x="600" y="232" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Shows impact and severity</text><text x="600" y="266" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Not itself an upgrade blocker</text>
<text x="995" y="129" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15803d">SAFE / WARNING</text><text x="995" y="159" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">decision.allow = true</text>
<text x="995" y="259" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#be123c">CRITICAL</text><text x="995" y="289" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Deterministic blockers · allow = false</text>
<path d="M355 215H439" stroke="#64748b" stroke-width="3" stroke-dasharray="7 8"/><path d="M750 185C790 185 800 140 834 140" stroke="#10b981" stroke-width="3" marker-end="url(#a)"/><path d="M750 245C790 245 800 270 834 270" stroke="#f43f5e" stroke-width="3" marker-end="url(#a)"/>
<text x="48" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">A node can be High risk while the overall upgrade decision remains SAFE; the report explains both.</text></svg>