<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Headlamp report proxy path</title><desc id="desc">The operator writes ClusterMirror and UpgradeAnalysis reports to configured destinations. The operator's reports service reads those destinations with operator credentials. The Headlamp plugin fetches reports through the Kubernetes API server service proxy, so browser storage credentials are not needed.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="410" rx="28" fill="url(#bg)"/><text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#172554">Reports reach Headlamp through the Kubernetes API</text>
<g filter="url(#s)"><rect x="45" y="135" width="205" height="145" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="335" y="135" width="230" height="145" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="650" y="135" width="235" height="145" rx="20" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="970" y="135" width="185" height="145" rx="20" fill="#fff" stroke="#f9a8d4" stroke-width="2"/></g>
<text x="147" y="174" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">Report destination</text><text x="147" y="207" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">File · S3 · Azure Blob</text><text x="147" y="235" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">PVC</text><text x="147" y="260" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Operator credentials</text>
<text x="450" y="174" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#6d28d9">mirops-reports</text><text x="450" y="207" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Reads configured storage</text><text x="450" y="235" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Runs in operator namespace</text>
<text x="767" y="174" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#047857">Kubernetes API server</text><text x="767" y="207" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Service proxy</text><text x="767" y="235" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Authenticated cluster path</text>
<text x="1062" y="174" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#9d174d">Headlamp</text><text x="1062" y="207" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Plugin reads report</text><text x="1062" y="235" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">No browser storage keys</text>
<path d="M250 207H324" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M565 207H639" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M885 207H959" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<text x="48" y="345" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">The plugin reads both ClusterMirror and UpgradeAnalysis reports through the operator service; cloud credentials stay with the operator.</text></svg>