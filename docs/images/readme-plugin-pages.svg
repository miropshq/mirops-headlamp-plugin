<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Mirops Headlamp plugin pages</title><desc id="desc">The Cluster Mirror page presents current state, namespace risk, components and dependency graph. The Upgrade Analyses page presents a target version decision, readiness, compatibility, blockers and optional remediation.</desc>
