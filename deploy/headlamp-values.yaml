# Headlamp Helm values that load the mirops plugin from its image.
#
# An initContainer copies the plugin from ghcr.io/miropshq/mirops-ui:dev
# into a shared emptyDir volume, which Headlamp scans on startup.
#
# Install:
#   helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/
#   helm repo update
#   helm install headlamp headlamp/headlamp -n headlamp --create-namespace \
#     -f deploy/headlamp-values.yaml
#
# Access:
#   kubectl -n headlamp port-forward svc/headlamp 8080:80
#   open http://localhost:8080
#
# The image is private, so create a ghcr pull secret first (see README in
# this file's header comment) and reference it via imagePullSecrets below.

# Pull secret for the private ghcr.io plugin image. Applied to the pod so it
# covers both the main Headlamp image and the mirops-plugin initContainer.
imagePullSecrets:
  - name: ghcr-mirops

config:
  # Directory Headlamp scans for plugins on startup.
  pluginsDir: /headlamp/plugins

initContainers:
  - name: mirops-plugin
    image: ghcr.io/miropshq/mirops-ui:dev
    imagePullPolicy: Always
    command:
      - sh
      - -c
      - 'mkdir -p /headlamp/plugins/mirops && cp -r /plugins/mirops/* /headlamp/plugins/mirops/'
    volumeMounts:
      - name: plugins
        mountPath: /headlamp/plugins

volumeMounts:
  - name: plugins
    mountPath: /headlamp/plugins

volumes:
  - name: plugins
    emptyDir: {}
