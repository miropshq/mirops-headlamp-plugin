name: Mirops UI - Headlamp Plugin for Mirops Operator - Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  # ─── CI ────────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ─── semantic-release ─────────────────────────────────────────────────────────
  # Reads conventional commits and automatically:
  #   - Determines the next semver version (patch / minor / major)
  #   - Generates a GitHub Release + tag
  #   - Triggers build-release via the `new_release_version` output
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: ci
    
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Native build per architecture ───────────────────────────────────────────
  # Each runner compiles and pushes directly with an architecture-specific tag.
  # The push-release job combines both into a manifest list.
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:v${{ needs.semantic-release.outputs.new_release_version }}-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag_suffix }}

  # ─── Publish to Artifact Hub (Headlamp Plugin Catalog) ─────────────────────────
  # Packages the plugin as a tarball, attaches it to the GitHub Release, and updates
  # artifacthub-pkg.yml (version + archive url/checksum). Artifact Hub re-scans the repo
  # and lists the new version in Headlamp's in-app Plugin Catalog — no manual step per
  # release (the repo is registered on artifacthub.io once).
  artifacthub:
    name: Publish to Artifact Hub
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    env:
      VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package the plugin tarball
        run: |
          npx headlamp-plugin package . out
          echo "TARBALL=$(ls out/*.tar.gz)" >> "$GITHUB_ENV"

      - name: Attach tarball to the release
        run: gh release upload "v${VERSION}" "$TARBALL" --clobber

      - name: Update artifacthub-pkg.yml
        run: |
          SHA=$(sha256sum "$TARBALL" | awk '{print $1}')
          URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/$(basename "$TARBALL")"
          sed -i "s|^version: .*|version: ${VERSION}|" artifacthub-pkg.yml
          sed -i "s|^createdAt: .*|createdAt: \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"|" artifacthub-pkg.yml
          sed -i "s|headlamp/plugin/archive-url: .*|headlamp/plugin/archive-url: \"${URL}\"|" artifacthub-pkg.yml
          sed -i "s|headlamp/plugin/archive-checksum: .*|headlamp/plugin/archive-checksum: \"SHA256:${SHA}\"|" artifacthub-pkg.yml

      - name: Publish metadata to the artifacthub branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Artifact Hub scans a dedicated 'artifacthub' branch — we never push to protected main,
          # and pushing here doesn't re-trigger this workflow (it runs on main only). Point the repo's
          # "Branch" to 'artifacthub' in its Artifact Hub settings. Images/logo stay on main (the
          # logoURL/screenshots are absolute raw URLs), so only the two metadata files live here.
          git checkout -B artifacthub
          git add --force artifacthub-pkg.yml artifacthub-repo.yml
          git commit -m "chore(artifacthub): publish v${VERSION}" || echo "metadata unchanged"
          git push --force origin artifacthub

  # ─── Merge manifest list ────────────────────────────────────────────────────
  # Combines both architecture tags into a manifest list with the final tags.
  push:
    name: Push release image (merge manifest)
    runs-on: ubuntu-latest
    needs: [build, semantic-release]
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:v${VERSION} \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:v${VERSION}-linux-amd64 \
            ghcr.io/${{ github.repository }}:v${VERSION}-linux-arm64

      - name: Inspect manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest

      - name: Notify Slack
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.workflow }} ${{ job.status }} for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.workflow }}* — *${{ job.status }}*\n`${{ github.repository }}` · `${{ github.ref_name }}` · `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }
