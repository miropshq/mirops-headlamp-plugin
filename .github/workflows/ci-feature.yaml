name: Mirops UI - Headlamp Plugin for Mirops Operator - Feature BRanches

on:
  push:
    branches:
      - feature/**

permissions:
  contents: read
  packages: write

jobs:
  # ─── CI ────────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
